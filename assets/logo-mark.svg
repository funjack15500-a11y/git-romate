<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="灵动词库">
  <defs>
    <linearGradient id="ld-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5aafbc"/>
      <stop offset="48%" stop-color="#3d7a8c"/>
      <stop offset="100%" stop-color="#2d5f70"/>
    </linearGradient>
    <linearGradient id="ld-sheen" x1="18" y1="10" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ld-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#1a3a44" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="18" fill="url(#ld-bg)"/>
  <rect width="64" height="64" rx="18" fill="url(#ld-sheen)"/>

  <!-- Soft inner well -->
  <rect x="10" y="10" width="44" height="44" rx="12" fill="#0f2a32" fill-opacity="0.14"/>

  <!-- Mark: open prompt slate + spark (gallery of ideas) -->
  <g filter="url(#ld-soft)" fill="#fff">
    <!-- Prompt card / slate -->
    <path d="M18.5 22.5c0-1.4 1.1-2.5 2.5-2.5h14.2c.9 0 1.7.5 2.1 1.2l5.4 9.4c.4.7.4 1.6 0 2.3l-5.4 9.4c-.4.8-1.2 1.2-2.1 1.2H21c-1.4 0-2.5-1.1-2.5-2.5V22.5z" fill-opacity="0.96"/>
    <!-- Card notch (folded corner) -->
    <path d="M37.2 20h3.3c.6 0 1 .5.8 1.1l-2.6 5.8c-.2.5-.8.7-1.3.5l-3.4-1.6c-.5-.2-.7-.8-.5-1.3L36.4 20.4c.2-.2.5-.4.8-.4z" fill-opacity="0.55"/>
    <!-- Three library lines -->
    <rect x="23" y="27.2" width="12.5" height="2.1" rx="1.05" fill="#2d5f70" fill-opacity="0.55"/>
    <rect x="23" y="31.6" width="10" height="2.1" rx="1.05" fill="#2d5f70" fill-opacity="0.42"/>
    <rect x="23" y="36" width="8" height="2.1" rx="1.05" fill="#2d5f70" fill-opacity="0.3"/>
  </g>

  <!-- Spark / inspiration accent -->
  <g transform="translate(41.5 17.5)">
    <path d="M0-7.2 1.55-1.9 7.2 0 1.55 1.9 0 7.2-1.55 1.9-7.2 0-1.55-1.9Z" fill="#fff7e8"/>
    <circle cx="0" cy="0" r="1.35" fill="#3d7a8c"/>
  </g>
</svg>

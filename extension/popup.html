<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <title>灵动词库 · 提示词小窗</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M5.5 4.5h9l4 4v11h-13z" />
          <path d="M14 4.5v4h4" />
          <path d="M8.5 12.5h7M8.5 15.5h7M8.5 18h4" />
        </svg>
      </span>
      <div class="brand-text">
        <strong>灵动词库</strong>
        <span id="metaLine">正在载入词库…</span>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="ghost-btn" id="siteBtn" title="打开网页版">网页版</button>
    </div>
  </header>

  <div class="search-row">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="search" id="search" placeholder="搜索标题、标签、正文…" autocomplete="off" aria-label="搜索提示词" />
    <button type="button" class="clear-btn" id="clearBtn" aria-label="清除搜索" hidden>×</button>
  </div>

  <div class="cats" id="cats" role="tablist" aria-label="提示词分类"></div>

  <div class="list-head">
    <span id="listCount">0 条</span>
    <span class="tip">点条目查看 · 点正文复制 · ♡ 收藏</span>
  </div>

  <main class="list" id="list" aria-live="polite">
    <div class="empty-state" id="emptyState">正在载入词库…</div>
  </main>

  <footer class="foot">
    <span id="dataSource">数据来源：灵动词库</span>
    <span class="foot-links">
      <a href="https://lingdongtech.de5.net/" id="siteLink" target="_blank" rel="noopener">网页版</a>
      <a href="mailto:funjack15500@gmail.com" id="mailLink">邮箱</a>
      <a href="https://github.com/funjack15500-a11y/git-romate/issues" id="issuesLink" target="_blank" rel="noopener">反馈</a>
    </span>
  </footer>

  <section class="detail" id="detail" aria-hidden="true" hidden>
    <div class="d-head">
      <button type="button" class="d-back" id="detailBack" aria-label="返回列表">‹ 返回</button>
      <span class="cat-badge" id="detailCat"></span>
      <button type="button" class="row-fav d-fav" id="detailFav" aria-label="加入我的收藏"></button>
    </div>
    <h2 class="d-title" id="detailTitle"></h2>
    <div class="d-tags" id="detailTags"></div>
    <p class="d-summary" id="detailSummary"></p>
    <div class="d-body-wrap">
      <div class="d-body" id="detailBody" role="button" tabindex="0" title="点击复制全文"></div>
      <p class="d-hint">点击上面这段正文即可复制</p>
    </div>
    <footer class="d-foot">
      <button type="button" class="d-copy" id="detailCopy">复制全文</button>
    </footer>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>

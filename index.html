<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵动词库 — AI 提示词库</title>
  <meta name="description" content="灵动词库：可搜索、可筛选、一键复制的 AI 提示词库。覆盖图像生成/编辑、海报、二次元、写作、编程与提示工程等分类。" />
  <meta name="keywords" content="灵动词库, AI 提示词, Prompt, 提示词库, 二次元, 图像生成, Lingdong" />
  <meta name="author" content="Lingdong" />
  <meta name="theme-color" content="#c026d3" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="灵动词库 — AI 提示词库" />
  <meta property="og:description" content="可搜索筛选的提示词画廊，一键复制即用。" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="anime-skin brand-lingdong">
  <div class="bg-layer" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="starfield" id="starfield"></div>
    <div class="grid-glow"></div>
    <div class="sakura-field" id="sakuraField"></div>
  </div>

  <header class="site-header">
    <a href="#" class="logo">
      <span class="logo-mark">✦</span>
      <span class="logo-text">
        <strong>灵动词库</strong>
        <small>Lingdong · Prompt Gallery</small>
      </span>
    </a>
    <nav class="header-nav" aria-label="站内导航">
      <a href="#gallery">词库</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="themeToggle" aria-label="切换主题"></button>
      <a class="btn btn-secondary" href="https://github.com" target="_blank" rel="noopener" id="githubLink" style="padding: 8px 14px; height: 40px;">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <span class="header-github-text">源码</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-deco" aria-hidden="true">
      <span class="deco-float d1">✦</span>
      <span class="deco-float d2">♡</span>
      <span class="deco-float d3">✧</span>
      <span class="deco-float d4">❀</span>
      <span class="deco-float d5">☆</span>
    </div>
    <div class="hero-badge">✦ Prompt Gallery</div>
    <p class="hero-kicker">LINGDONG · AI PROMPTS</p>
    <h1 class="hero-title">发现好用的<br /><span>AI 提示词</span></h1>
    <p class="hero-lead">
      按<strong>海报、信息图、二次元、写作、编程、提示工程</strong>等分类浏览，
      支持搜索、筛选与收藏，点开即可<strong>一键复制</strong>到常用 AI 工具。
    </p>
    <div class="hero-actions">
      <a href="#gallery" class="btn btn-primary">浏览词库</a>
    </div>

    <!-- 滚动播报：热门条目 -->
    <div class="hero-ticker" aria-label="词库滚动预览">
      <div class="ticker-label">热门</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="tickerTrackA"></div>
      </div>
    </div>
    <div class="hero-ticker hero-ticker-b" aria-hidden="true">
      <div class="ticker-viewport">
        <div class="ticker-track ticker-track-rev" id="tickerTrackB"></div>
      </div>
    </div>

    <!-- 精选卡片轮播 -->
    <div class="hero-spotlight" id="heroSpotlight" aria-label="精选提示词轮播">
      <button type="button" class="spotlight-nav prev" id="spotPrev" aria-label="上一条">‹</button>
      <div class="spotlight-stage" id="spotlightStage"></div>
      <button type="button" class="spotlight-nav next" id="spotNext" aria-label="下一条">›</button>
      <div class="spotlight-dots" id="spotlightDots"></div>
    </div>

    <div class="stats">
      <div class="stat bubble-stat">
        <strong id="totalCount">0</strong>
        <span>收录提示词</span>
      </div>
      <div class="stat bubble-stat">
        <strong id="resultCount">0</strong>
        <span>当前结果</span>
      </div>
      <div class="stat bubble-stat">
        <strong id="favCount">0</strong>
        <span>已收藏</span>
      </div>
    </div>
  </section>

  <section id="gallery" class="gallery">
    <div class="controls" id="controlsBar">
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="searchInput" placeholder="搜索提示词、标签、内容…（/ 聚焦）" autocomplete="off" />
        <button type="button" class="search-clear" id="searchClear" aria-label="清除搜索" hidden>×</button>
      </div>
      <div class="filters">
        <div class="category-dropdown">
          <button type="button" class="category-trigger" id="categoryTrigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="categoryText">全部分类</span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M1 1L5 5L9 1" />
            </svg>
          </button>
          <div class="category-options" id="categoryOptions" role="listbox"></div>
        </div>
        <button type="button" class="filter-btn active" data-filter="all">全部类型</button>
        <button type="button" class="filter-btn" data-filter="recent-week">近一周</button>
        <button type="button" class="filter-btn" data-filter="generate">生成</button>
        <button type="button" class="filter-btn" data-filter="edit">编辑</button>
        <button type="button" class="filter-btn" data-filter="favorites">收藏</button>
        <label class="sort-wrap">
          <span class="sr-only">排序</span>
          <select id="sortSelect" class="sort-select" aria-label="排序方式">
            <option value="newest">最新优先</option>
            <option value="oldest">最早优先</option>
            <option value="title">标题 A–Z</option>
            <option value="category">按分类</option>
          </select>
        </label>
        <button type="button" class="filter-btn filter-reset" id="resetFilters" title="重置筛选">重置</button>
      </div>
    </div>

    <div class="toolbar-meta">
      <p class="result-line" id="resultLine">共 <strong id="resultCountInline">0</strong> 条</p>
      <div class="active-chips" id="activeChips" hidden></div>
    </div>

    <div class="announcement" id="announcement">
      <div id="announcementSlides"></div>
      <div class="announcement-dots" id="announcementDots"></div>
    </div>

    <div id="promptsGrid" class="grid" aria-live="polite"></div>
  </section>

  <footer class="site-footer">
    <p class="footer-brand">© <span id="footerYear">2026</span> <span id="footerName">灵动词库</span></p>
    <p class="footer-sub">AI 提示词库 · <a href="https://lingdongtech.de5.net/" id="footerSite">lingdongtech.de5.net</a></p>
  </footer>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-cover" id="modalCover">
        <button type="button" class="modal-close" id="modalClose" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <h2 id="modalTitle">标题</h2>
        <p class="modal-summary" id="modalSummary"></p>
        <div class="modal-tags" id="modalTags"></div>
        <div class="prompt-meta-row">
          <span class="prompt-len" id="promptLen"></span>
          <span class="prompt-date" id="modalDate"></span>
        </div>
        <div class="prompt-box" id="modalPrompt"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="copyBtn">复制提示词</button>
          <button type="button" class="btn btn-secondary" id="modalFavBtn">收藏</button>
          <button type="button" class="btn btn-ghost" id="shareBtn">复制链接</button>
        </div>
      </div>
    </div>
  </div>

  <button type="button" class="back-top" id="backTop" aria-label="回到顶部" title="回到顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
